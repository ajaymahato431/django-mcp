name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Offline unit tests only — integration tests hit the live documentation
      # sites and would make CI fail on upstream outages rather than on our bugs.
      - name: Run unit tests
        run: npm test

      - name: Verify the CLI responds
        run: |
          node index.js --version
          node index.js --help

      - name: Verify the published package contents
        run: npm pack --dry-run

  integration:
    name: Integration (live docs)
    runs-on: ubuntu-latest
    # Non-blocking: an upstream outage should not turn the build red.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run test:integration
